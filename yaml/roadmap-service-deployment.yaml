apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmap-service
  template:
    metadata:
      labels:
        app: roadmap-service
    spec:
      containers:
        - name: roadmap-service
          image: REPLACE_WITH_ROADMAP_SERVICE_IMAGE
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ivolve-config
            - secretRef:
                name: ivolve-secrets
