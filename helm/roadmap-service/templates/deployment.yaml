apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-roadmap-service
  labels:
    app: roadmap-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: roadmap-service
  template:
    metadata:
      labels:
        app: roadmap-service
    spec:
      containers:
        - name: roadmap-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
            